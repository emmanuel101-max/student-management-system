
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Management System</h1>
            <p>Register, manage and keep track of students</p>
        </header>

        <section class="form-section">
            <h2 id="formTitle">Register Student</h2>

            <form id="studentForm">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="matric">Matric Number</label>
                    <input type="text" id="matric" placeholder="Enter matric number" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="Enter department" required>
                </div>

                <div class="form-group">
                    <label for="level">Level</label>
                    <select id="level" required>
                        <option value="">Select Level</option>
                        <option value="100 Level">100 Level</option>
                        <option value="200 Level">200 Level</option>
                        <option value="300 Level">300 Level</option>
                        <option value="400 Level">400 Level</option>
                        <option value="500 Level">500 Level</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn">Register Student</button>
                <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
            </form>
        </section>

        <section class="students-section">
            <h2>Registered Students</h2>

            <input
                type="search"
                id="searchInput"
                placeholder="Search by name, matric number or department..."
            >

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>S/N</th>
                            <th>Full Name</th>
                            <th>Matric Number</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentList">
                        <!-- Students will appear here -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No students registered yet.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
